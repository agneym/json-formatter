name: Node CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Bun latest
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install, build, and test
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test
        env:
          CI: true
